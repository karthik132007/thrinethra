name: verify
on: [push, pull_request]
jobs:
  mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/frontend/package-lock.json}
      - run: python -m venv .venv
      - run: .venv/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: .venv/bin/pip install -c requirements.lock -e '.[test,vision]'
      - run: .venv/bin/python scripts/download_assets.py
      - run: make test evaluate
      - run: npm --prefix apps/frontend ci
      - run: make typecheck build
      - run: cd apps/frontend && PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/runtime/browsers npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-and-browser-evidence
          path: |
            evaluations/
            docs/screenshots/
            apps/frontend/test-results/
